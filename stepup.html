<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step-up SIP Calculator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #ec4899; /* Pink border for step-up vibe */
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 4px;
        }
        /* Hide spin buttons for number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .wealth-card {
            background: linear-gradient(135deg, #db2777 0%, #9333ea 100%); /* Pink to Purple */
            box-shadow: 0 10px 25px -5px rgba(219, 39, 119, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        
        // Icon Components
        const IconTrending = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>;
        const IconPie = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>;
        const IconInfo = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
        const IconStairs = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>; // Generic trending up used as stairs metaphor

        const App = () => {
            const [initialInvestment, setInitialInvestment] = useState(5000);
            const [stepUpPercentage, setStepUpPercentage] = useState(10);
            const [interestRate, setInterestRate] = useState(12);
            const [years, setYears] = useState(10);
            const [viewMode, setViewMode] = useState('graph');
            const [hoveredYear, setHoveredYear] = useState(null);

            // Indian Currency Formatting
            const formatCurrency = (val) => {
                return new Intl.NumberFormat('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    maximumFractionDigits: 0,
                }).format(val);
            };

            const formatCompact = (val) => formatCurrency(val);

            // Logic: Step-up SIP Calculation
            const data = useMemo(() => {
                const monthlyRate = interestRate / 12 / 100;
                const totalMonths = years * 12;
                const points = [];
                
                let currentTotalValue = 0;
                let totalInvested = 0;
                let currentMonthlyInvestment = initialInvestment;

                for (let m = 1; m <= totalMonths; m++) {
                    // Step Up Logic: Increase investment every 12th month (starting year 2)
                    if (m > 1 && (m - 1) % 12 === 0) {
                        currentMonthlyInvestment = currentMonthlyInvestment * (1 + stepUpPercentage / 100);
                    }

                    totalInvested += currentMonthlyInvestment;
                    currentTotalValue = (currentTotalValue + currentMonthlyInvestment) * (1 + monthlyRate);

                    if (m % 12 === 0) {
                        points.push({
                            year: m / 12,
                            invested: totalInvested,
                            value: currentTotalValue,
                            profit: currentTotalValue - totalInvested,
                            monthlySip: currentMonthlyInvestment // Track current SIP amount
                        });
                    }
                }
                return points;
            }, [initialInvestment, stepUpPercentage, interestRate, years]);

            const finalData = data[data.length - 1] || { value: 0, invested: 0, profit: 0, monthlySip: 0 };

            // --- SUB-COMPONENTS ---

            const Chart = () => {
                if (data.length === 0) return null;
                const height = 200;
                const maxVal = finalData.value;
                const getY = (val) => height - (val / maxVal) * height;
                const getX = (index) => (index / (data.length - 1)) * 100;

                let valuePath = `M0,${height} `;
                data.forEach((d, i) => { valuePath += `L${getX(i)},${getY(d.value)} `; });
                valuePath += `L100,${height} Z`;

                let investedPath = `M0,${height} `;
                data.forEach((d, i) => { investedPath += `L${getX(i)},${getY(d.invested)} `; });
                investedPath += `L100,${height} L0,${height} Z`;

                return (
                    <div className="relative h-[220px] w-full mt-4 select-none group touch-none">
                        {/* Axis Labels */}
                        <div className="absolute left-0 top-0 bottom-0 flex flex-col justify-between text-[10px] text-slate-400 font-mono w-14 leading-none">
                            <span>{formatCompact(maxVal)}</span>
                            <span>{formatCompact(maxVal/2)}</span>
                            <span>0</span>
                        </div>

                        <div className="absolute inset-0 ml-16">
                            <svg className="w-full h-full overflow-visible" preserveAspectRatio="none" viewBox="0 0 100 200">
                                <defs>
                                    <linearGradient id="profitGradient" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor="#db2777" stopOpacity="0.8" />
                                        <stop offset="100%" stopColor="#db2777" stopOpacity="0.1" />
                                    </linearGradient>
                                     <linearGradient id="investedGradient" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor="#475569" stopOpacity="0.6" />
                                        <stop offset="100%" stopColor="#475569" stopOpacity="0.1" />
                                    </linearGradient>
                                </defs>

                                {/* Profit Area (Pink/Purple) */}
                                <path d={valuePath} fill="url(#profitGradient)" className="transition-all duration-300 ease-out"/>
                                
                                {/* Invested Area (Slate) */}
                                <path d={investedPath} fill="url(#investedGradient)" />
                                
                                {/* Lines */}
                                <path d={valuePath.split('L100')[0]} fill="none" stroke="#be185d" strokeWidth="2" vectorEffect="non-scaling-stroke" />
                                <path d={investedPath.split('L100')[0]} fill="none" stroke="#334155" strokeWidth="2" strokeDasharray="3 3" vectorEffect="non-scaling-stroke" />
                            </svg>

                            {/* Interactive Hover Overlay */}
                            <div className="absolute inset-0 flex">
                                {data.map((d, i) => (
                                    <div 
                                        key={i} 
                                        className="flex-1 hover:bg-white/5 z-10 cursor-pointer relative group/bar"
                                        onMouseEnter={() => setHoveredYear(d.year)}
                                        onMouseLeave={() => setHoveredYear(null)}
                                        onTouchStart={() => setHoveredYear(d.year)}
                                    >
                                        {/* Tooltip */}
                                        <div className="hidden group-hover/bar:block absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-slate-800 text-white text-xs p-3 rounded-lg shadow-xl whitespace-nowrap z-20 pointer-events-none border border-slate-700">
                                            <div className="font-bold text-pink-300 border-b border-slate-600 pb-1 mb-1">Year {d.year}</div>
                                            <div className="text-white mb-1">Total: {formatCompact(d.value)}</div>
                                            <div className="text-slate-400 mb-1">Self: {formatCompact(d.invested)}</div>
                                            <div className="text-xs text-slate-500 italic mt-1 pt-1 border-t border-slate-700">
                                                SIP: {formatCompact(d.monthlySip)}/mo
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            const PieView = () => {
                const total = finalData.value;
                const investedPct = total > 0 ? (finalData.invested / total) * 100 : 0;
                const profitPct = total > 0 ? (finalData.profit / total) * 100 : 0;
                
                return (
                     <div className="h-[220px] w-full mt-4 flex items-center justify-center gap-8 animate-in fade-in duration-500">
                        <div className="relative w-40 h-40">
                            <svg viewBox="0 0 42 42" className="w-full h-full transform -rotate-90">
                                <circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="#e2e8f0" strokeWidth="6" />
                                <circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="#db2777" strokeWidth="6" 
                                    strokeDasharray={`${profitPct} ${100 - profitPct}`} 
                                    strokeDashoffset="0"
                                    className="transition-all duration-1000 ease-out"
                                />
                                <circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="#475569" strokeWidth="6" 
                                    strokeDasharray={`${investedPct} ${100 - investedPct}`} 
                                    strokeDashoffset={`-${profitPct}`}
                                    className="transition-all duration-1000 ease-out"
                                />
                            </svg>
                            <div className="absolute inset-0 flex flex-col items-center justify-center text-xs text-slate-500 font-bold">
                                <span>Total</span>
                                <span className="text-slate-800">{formatCompact(total)}</span>
                            </div>
                        </div>

                        <div className="space-y-4 text-sm">
                            <div>
                                <div className="flex items-center gap-2 text-slate-500 mb-1">
                                    <div className="w-3 h-3 bg-slate-500 rounded-full"></div>
                                    Your Money
                                </div>
                                <div className="font-bold text-slate-700 text-lg">{investedPct.toFixed(1)}%</div>
                                <div className="text-xs text-slate-400">{formatCompact(finalData.invested)}</div>
                            </div>
                            <div>
                                <div className="flex items-center gap-2 text-pink-600 mb-1">
                                    <div className="w-3 h-3 bg-pink-600 rounded-full"></div>
                                    Wealth Gained
                                </div>
                                <div className="font-bold text-slate-700 text-lg">{profitPct.toFixed(1)}%</div>
                                <div className="text-xs text-slate-400">{formatCompact(finalData.profit)}</div>
                            </div>
                        </div>
                     </div>
                )
            }

            return (
                <div className="min-h-screen p-4 md:p-8 flex items-center justify-center">
                    
                    <div className="w-full max-w-5xl grid md:grid-cols-12 gap-6">
                        
                        {/* LEFT COLUMN: Controls */}
                        <div className="md:col-span-5 space-y-4">
                            
                            {/* Title Card */}
                            <div className="bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-3xl text-white">
                                <h1 className="text-3xl font-bold flex items-center gap-3 mb-2">
                                    <span className="bg-pink-500 p-2 rounded-xl text-white">
                                        <IconTrending />
                                    </span>
                                    Step-up SIP
                                </h1>
                                <p className="text-slate-300 text-sm">Automate your wealth creation by increasing SIPs annually.</p>
                            </div>

                            {/* Controls Card */}
                            <div className="glass-card rounded-3xl p-6 md:p-8 shadow-xl space-y-8">
                                
                                {/* Initial Monthly Input */}
                                <div>
                                    <div className="flex justify-between items-end mb-4">
                                        <label className="text-slate-500 font-semibold text-sm uppercase tracking-wide">
                                            Initial Monthly SIP
                                        </label>
                                        <div className="flex items-center bg-slate-100 rounded-lg px-3 py-1 border border-transparent focus-within:border-pink-500 focus-within:bg-white transition-all">
                                            <span className="text-xl font-bold text-slate-500 mr-1">₹</span>
                                            <input 
                                                type="number"
                                                value={initialInvestment}
                                                onChange={(e) => {
                                                    const val = e.target.value;
                                                    if(val === '') setInitialInvestment(''); 
                                                    else setInitialInvestment(parseInt(val) || 0);
                                                }}
                                                className="text-2xl font-bold text-slate-800 bg-transparent w-full focus:outline-none text-right"
                                            />
                                        </div>
                                    </div>
                                    <input 
                                        type="range" min="500" max="200000" step="500" 
                                        value={initialInvestment || 0} 
                                        onChange={(e) => setInitialInvestment(Number(e.target.value))}
                                    />
                                    <div className="flex justify-between text-xs text-slate-400 mt-2 font-medium">
                                        <span>₹500</span>
                                        <span>₹2L</span>
                                    </div>
                                </div>

                                {/* Step Up Input */}
                                <div>
                                    <div className="flex justify-between items-end mb-4">
                                        <label className="text-slate-500 font-semibold text-sm uppercase tracking-wide">Annual Step-up</label>
                                        <div className="text-2xl font-bold text-slate-800 bg-pink-50 px-3 py-1 rounded-lg border border-pink-100">
                                            {stepUpPercentage}%
                                        </div>
                                    </div>
                                    <input 
                                        type="range" min="0" max="50" step="1" 
                                        value={stepUpPercentage} 
                                        onChange={(e) => setStepUpPercentage(Number(e.target.value))}
                                    />
                                    <div className="flex justify-between text-xs text-slate-400 mt-2 font-medium">
                                        <span>0% (Fixed)</span>
                                        <span>50% (Aggressive)</span>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-2 bg-slate-100 p-2 rounded">
                                        Increasing SIP by <strong>{stepUpPercentage}%</strong> yearly. 
                                        Next year SIP: <span className="font-semibold text-slate-700">{formatCompact(initialInvestment * (1 + stepUpPercentage/100))}</span>
                                    </p>
                                </div>

                                {/* Interest Input */}
                                <div>
                                    <div className="flex justify-between items-end mb-4">
                                        <label className="text-slate-500 font-semibold text-sm uppercase tracking-wide">Return Rate (p.a)</label>
                                        <div className="text-2xl font-bold text-slate-800 bg-slate-100 px-3 py-1 rounded-lg">
                                            {interestRate}%
                                        </div>
                                    </div>
                                    <input 
                                        type="range" min="1" max="30" step="0.5" 
                                        value={interestRate} 
                                        onChange={(e) => setInterestRate(Number(e.target.value))}
                                    />
                                    <div className="flex justify-between text-xs text-slate-400 mt-2 font-medium">
                                        <span>6%</span>
                                        <span>30%</span>
                                    </div>
                                </div>

                                {/* Years Input */}
                                <div>
                                    <div className="flex justify-between items-end mb-4">
                                        <label className="text-slate-500 font-semibold text-sm uppercase tracking-wide">Time Period</label>
                                        <div className="text-2xl font-bold text-slate-800 bg-slate-100 px-3 py-1 rounded-lg">
                                            {years} Years
                                        </div>
                                    </div>
                                    <input 
                                        type="range" min="1" max="50" step="1" 
                                        value={years} 
                                        onChange={(e) => setYears(Number(e.target.value))}
                                    />
                                    <div className="flex justify-between text-xs text-slate-400 mt-2 font-medium">
                                        <span>1 Yr</span>
                                        <span>50 Yrs</span>
                                    </div>
                                </div>

                            </div>
                        </div>

                        {/* RIGHT COLUMN: Results & Chart */}
                        <div className="md:col-span-7 flex flex-col gap-6">
                            
                            {/* Wealth Summary Card */}
                            <div className="wealth-card rounded-3xl p-6 md:p-8 text-white relative overflow-hidden">
                                <div className="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
                                <div className="absolute bottom-0 left-0 w-32 h-32 bg-black/10 rounded-full blur-2xl"></div>
                                
                                <div className="relative z-10">
                                    <div className="text-white/80 font-medium mb-1 uppercase tracking-wider text-xs">Projected Wealth Value</div>
                                    <div className="text-4xl md:text-5xl font-bold mb-6 tracking-tight">
                                        {formatCurrency(finalData.value)}
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4 border-t border-white/20 pt-4">
                                        <div>
                                            <div className="text-white/70 text-xs mb-1">Total Invested</div>
                                            <div className="text-xl font-semibold">{formatCompact(finalData.invested)}</div>
                                        </div>
                                        <div>
                                            <div className="text-pink-200 text-xs mb-1">Pure Profit</div>
                                            <div className="text-xl font-semibold">+{formatCompact(finalData.profit)}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Chart Container */}
                            <div className="glass-card rounded-3xl p-6 shadow-xl flex-1 flex flex-col">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="font-bold text-slate-700">Growth Analysis</h3>
                                    
                                    <div className="flex bg-slate-100 p-1 rounded-lg">
                                        <button 
                                            onClick={() => setViewMode('graph')}
                                            className={`px-3 py-1 rounded-md text-sm font-medium transition-all ${viewMode === 'graph' ? 'bg-white shadow text-pink-600' : 'text-slate-500'}`}
                                        >
                                            <IconTrending />
                                        </button>
                                        <button 
                                            onClick={() => setViewMode('pie')}
                                            className={`px-3 py-1 rounded-md text-sm font-medium transition-all ${viewMode === 'pie' ? 'bg-white shadow text-pink-600' : 'text-slate-500'}`}
                                        >
                                            <IconPie />
                                        </button>
                                    </div>
                                </div>

                                {viewMode === 'graph' ? <Chart /> : <PieView />}

                                <div className="mt-6 pt-6 border-t border-slate-100 flex gap-4 text-xs md:text-sm text-slate-500 bg-slate-50/50 p-4 rounded-xl">
                                    <IconInfo />
                                    <p>
                                        In <strong>Year {years}</strong>, your monthly SIP will have grown to <strong className="text-slate-700">{formatCompact(finalData.monthlySip)}</strong> per month due to the annual step-up.
                                    </p>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
