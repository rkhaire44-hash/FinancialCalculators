<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Children Education Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #f97316; /* Orange border */
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #ccfbf1;
            border-radius: 2px;
        }
        /* Hide spin buttons for number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .wealth-card {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); /* Orange Gradient */
            box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.5);
        }
        
        /* Bar Animation */
        .bar-enter {
            animation: growUp 0.6s ease-out forwards;
            transform-origin: bottom;
        }
        @keyframes growUp {
            from { transform: scaleY(0); }
            to { transform: scaleY(1); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        
        // Icon Components
        const IconGraduation = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 0 6-2 6-5.5V12"/><path d="M6 12v5.5"/></svg>;
        const IconBaby = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.8 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.8A9 9 0 0 1 12 3c2 0 3.5.6 4.7 1.3"/><path d="M18.5 4.5 16 10"/><path d="M5.5 4.5 8 10"/></svg>;
        const IconBook = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>;
        const IconInfo = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;

        const App = () => {
            // State
            const [childAge, setChildAge] = useState(5);
            const [collegeAge, setCollegeAge] = useState(18);
            const [currentCost, setCurrentCost] = useState(2500000); // 25 Lakhs
            const [inflation, setInflation] = useState(10); // Education inflation is high
            const [existingSavings, setExistingSavings] = useState(200000);
            const [returnRate, setReturnRate] = useState(12);
            
            const [hoveredBar, setHoveredBar] = useState(null);

            // Indian Currency Formatting
            const formatCurrency = (val) => {
                return new Intl.NumberFormat('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    maximumFractionDigits: 0,
                }).format(val);
            };

            const formatCompact = (val) => {
                return new Intl.NumberFormat('en-IN', {
                    notation: "compact",
                    compactDisplay: "short",
                    style: 'currency',
                    currency: 'INR',
                }).format(val);
            };

            // Logic: Education Planner
            const calculation = useMemo(() => {
                // 1. Time Horizon
                const yearsToCollege = Math.max(1, collegeAge - childAge);
                const monthsToInvest = yearsToCollege * 12;

                // 2. Future Cost of Education
                // FV = PV * (1 + r)^n
                const futureCost = currentCost * Math.pow(1 + inflation / 100, yearsToCollege);

                // 3. Growth of Existing Savings
                const monthlyRate = returnRate / 12 / 100;
                const savingsFV = existingSavings * Math.pow(1 + monthlyRate, monthsToInvest);

                // 4. Shortfall & SIP
                let shortfall = futureCost - savingsFV;
                if (shortfall < 0) shortfall = 0;

                // PMT Formula for SIP
                const requiredSIP = shortfall > 0 
                    ? (shortfall * monthlyRate) / (Math.pow(1 + monthlyRate, monthsToInvest) - 1)
                    : 0;

                // 5. Generate Bar Data (Year by Year)
                const points = [];
                let currentCorpus = existingSavings;
                let totalInvested = existingSavings;

                for (let y = 1; y <= yearsToCollege; y++) {
                    // Calculate growth for this year
                    // For simplicity in annual bars, we'll approximate annual compounding for the chart logic
                    // or simulate 12 months inside.
                    
                    for(let m=0; m<12; m++) {
                        currentCorpus = (currentCorpus + requiredSIP) * (1 + monthlyRate);
                        totalInvested += requiredSIP;
                    }
                    
                    // Interest Component
                    const interestComponent = currentCorpus - totalInvested;

                    points.push({
                        age: childAge + y,
                        totalValue: currentCorpus,
                        invested: totalInvested,
                        interest: interestComponent
                    });
                }

                return {
                    yearsToCollege,
                    futureCost,
                    requiredSIP,
                    points
                };
            }, [childAge, collegeAge, currentCost, inflation, existingSavings, returnRate]);

            const finalData = calculation.points[calculation.points.length - 1] || { totalValue: 0 };

            // --- SUB-COMPONENTS ---

            const BarChart = () => {
                const data = calculation.points;
                if (data.length === 0) return null;

                const maxVal = Math.max(calculation.futureCost, finalData.totalValue) * 1.1;

                return (
                    <div className="relative h-[250px] w-full mt-6 mb-4 select-none">
                        
                        {/* Grid Lines */}
                        <div className="absolute inset-0 flex flex-col justify-between pointer-events-none">
                            <div className="w-full border-t border-dashed border-teal-200/50 h-0"></div>
                            <div className="w-full border-t border-dashed border-teal-200/30 h-0"></div>
                            <div className="w-full border-t border-dashed border-teal-200/30 h-0"></div>
                            <div className="w-full border-b border-teal-200/50 h-0"></div>
                        </div>
                        
                        {/* Bars Container */}
                        <div className="absolute inset-0 flex items-end justify-between px-2 gap-1 md:gap-2">
                            {data.map((d, i) => {
                                const heightPct = (d.totalValue / maxVal) * 100;
                                const investedPct = (d.invested / d.totalValue) * 100; 
                                const interestPct = 100 - investedPct;

                                return (
                                    <div 
                                        key={i} 
                                        className="relative flex-1 flex flex-col justify-end group cursor-pointer"
                                        style={{ height: `${heightPct}%` }}
                                        onMouseEnter={() => setHoveredBar(d)}
                                        onMouseLeave={() => setHoveredBar(null)}
                                        onTouchStart={() => setHoveredBar(d)}
                                    >
                                        {/* Tooltip */}
                                        <div className="hidden group-hover:block absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-slate-800 text-white text-xs p-3 rounded-xl shadow-xl whitespace-nowrap z-30 pointer-events-none w-auto min-w-[120px]">
                                            <div className="font-bold text-orange-400 border-b border-slate-600 pb-1 mb-1">Age {d.age}</div>
                                            <div className="flex justify-between gap-4 text-teal-200">
                                                <span>Value:</span>
                                                <span className="font-bold text-white">{formatCompact(d.totalValue)}</span>
                                            </div>
                                            <div className="flex justify-between gap-4 text-slate-400">
                                                <span>Invested:</span>
                                                <span>{formatCompact(d.invested)}</span>
                                            </div>
                                            <div className="flex justify-between gap-4 text-orange-300">
                                                <span>Gain:</span>
                                                <span>{formatCompact(d.interest)}</span>
                                            </div>
                                        </div>

                                        {/* The Stacked Bar */}
                                        <div className="w-full h-full rounded-t-md overflow-hidden flex flex-col-reverse shadow-lg bar-enter transition-transform duration-200 hover:scale-105 hover:shadow-orange-500/20">
                                            {/* Principal (Bottom) */}
                                            <div 
                                                className="w-full bg-teal-600 transition-all duration-500"
                                                style={{ height: `${investedPct}%` }}
                                            ></div>
                                            {/* Interest (Top) */}
                                            <div 
                                                className="w-full bg-orange-400 transition-all duration-500"
                                                style={{ height: `${interestPct}%` }}
                                            ></div>
                                        </div>

                                        {/* X-Axis Label (Age) - Show only for some */}
                                        <div className="absolute top-full left-1/2 -translate-x-1/2 mt-2 text-[10px] font-bold text-teal-700">
                                           {d.age}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        
                        {/* Target Line */}
                        <div 
                            className="absolute left-0 right-0 border-t-2 border-dashed border-red-500 z-10 opacity-70 flex items-center justify-end"
                            style={{ bottom: `${(calculation.futureCost / maxVal) * 100}%` }}
                        >
                            <span className="bg-red-500 text-white text-[10px] px-1 rounded mr-2 -mt-6">Goal: {formatCompact(calculation.futureCost)}</span>
                        </div>

                    </div>
                );
            };

            return (
                <div className="min-h-screen p-4 md:p-8 flex items-center justify-center">
                    
                    <div className="w-full max-w-6xl grid md:grid-cols-12 gap-6">
                        
                        {/* LEFT COLUMN: Controls */}
                        <div className="md:col-span-5 space-y-4">
                            
                            {/* Title Card */}
                            <div className="bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-3xl text-white">
                                <h1 className="text-3xl font-bold flex items-center gap-3 mb-2">
                                    <span className="bg-teal-900/50 p-2 rounded-xl text-white border border-teal-400/30">
                                        <IconGraduation />
                                    </span>
                                    Education Plan
                                </h1>
                                <p className="text-teal-100 text-sm">Secure your child's future against education inflation.</p>
                            </div>

                            {/* Controls Card */}
                            <div className="glass-card rounded-3xl p-6 md:p-8 shadow-xl space-y-6 max-h-[70vh] overflow-y-auto">
                                
                                {/* 1. Child Details */}
                                <div className="space-y-4 border-b border-teal-100 pb-6">
                                    <div className="flex items-center gap-2 text-teal-700 font-bold uppercase text-xs tracking-wider">
                                        <IconBaby size={16}/> Child Profile
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-slate-500 text-xs font-semibold">Current Age</label>
                                            <div className="flex items-center gap-2">
                                                <input type="number" value={childAge} onChange={(e) => setChildAge(Number(e.target.value))} className="w-full font-bold text-slate-700 bg-slate-50 p-2 rounded border border-slate-200" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-slate-500 text-xs font-semibold">College Start Age</label>
                                            <div className="flex items-center gap-2">
                                                <input type="number" value={collegeAge} onChange={(e) => setCollegeAge(Number(e.target.value))} className="w-full font-bold text-slate-700 bg-slate-50 p-2 rounded border border-slate-200" />
                                            </div>
                                        </div>
                                    </div>
                                    <input type="range" min="0" max="15" step="1" value={childAge} onChange={(e) => setChildAge(Number(e.target.value))} className="w-full" />
                                    <div className="text-xs text-teal-600 font-medium text-center bg-teal-50 py-1 rounded">
                                        {Math.max(0, collegeAge - childAge)} Years to Invest
                                    </div>
                                </div>

                                {/* 2. Cost Section */}
                                <div className="space-y-4 border-b border-teal-100 pb-6">
                                    <div className="flex items-center gap-2 text-teal-700 font-bold uppercase text-xs tracking-wider">
                                        <IconBook size={16}/> Education Costs
                                    </div>

                                    {/* Current Cost */}
                                    <div>
                                        <div className="flex justify-between items-end mb-2">
                                            <label className="text-slate-500 font-semibold text-xs">Cost of Degree (Today)</label>
                                            <div className="flex items-center bg-slate-100 rounded px-2 py-1">
                                                <span className="text-sm font-bold text-slate-500 mr-1">₹</span>
                                                <input type="number" value={currentCost} onChange={(e) => setCurrentCost(Number(e.target.value))} className="text-lg font-bold text-slate-800 bg-transparent w-32 text-right focus:outline-none" />
                                            </div>
                                        </div>
                                        <input type="range" min="500000" max="10000000" step="500000" value={currentCost} onChange={(e) => setCurrentCost(Number(e.target.value))} />
                                        <div className="flex justify-between text-xs text-slate-400 mt-1">
                                            <span>B.Tech (10L)</span>
                                            <span>MBA (25L)</span>
                                            <span>Foreign (50L+)</span>
                                        </div>
                                    </div>

                                    {/* Inflation */}
                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <label className="text-slate-500 font-semibold">Education Inflation</label>
                                            <span className="text-red-500 font-bold">{inflation}%</span>
                                        </div>
                                        <input type="range" min="5" max="15" step="0.5" value={inflation} onChange={(e) => setInflation(Number(e.target.value))} />
                                        <p className="text-[10px] text-slate-400 mt-1">Note: Education costs rise faster than normal inflation.</p>
                                    </div>
                                </div>

                                {/* 3. Finances Section */}
                                <div className="space-y-4">
                                    <div className="flex items-center gap-2 text-teal-700 font-bold uppercase text-xs tracking-wider">
                                        <IconInfo size={16}/> Savings Plan
                                    </div>

                                    {/* Existing Savings */}
                                    <div>
                                        <div className="flex justify-between items-end mb-2">
                                            <label className="text-slate-500 font-semibold text-xs">Savings for Child</label>
                                            <div className="flex items-center bg-slate-100 rounded px-2 py-1">
                                                <span className="text-sm font-bold text-slate-500 mr-1">₹</span>
                                                <input type="number" value={existingSavings} onChange={(e) => setExistingSavings(Number(e.target.value))} className="text-lg font-bold text-slate-800 bg-transparent w-28 text-right focus:outline-none" />
                                            </div>
                                        </div>
                                        <input type="range" min="0" max="5000000" step="50000" value={existingSavings} onChange={(e) => setExistingSavings(Number(e.target.value))} />
                                    </div>

                                    {/* Return Rate */}
                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <label className="text-slate-500 font-semibold">Expected Return</label>
                                            <span className="text-teal-700 font-bold">{returnRate}%</span>
                                        </div>
                                        <input type="range" min="6" max="18" step="0.5" value={returnRate} onChange={(e) => setReturnRate(Number(e.target.value))} />
                                    </div>
                                </div>

                            </div>
                        </div>

                        {/* RIGHT COLUMN: Results & Chart */}
                        <div className="md:col-span-7 flex flex-col gap-6">
                            
                            {/* Required SIP Card */}
                            <div className="wealth-card rounded-3xl p-6 md:p-8 text-white relative overflow-hidden transition-all duration-300">
                                <div className="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
                                <div className="absolute bottom-0 left-0 w-32 h-32 bg-black/10 rounded-full blur-2xl"></div>
                                
                                <div className="relative z-10 grid md:grid-cols-2 gap-8 items-center">
                                    <div>
                                        <div className="text-orange-100 font-medium mb-1 uppercase tracking-wider text-xs">Future Cost (Age {collegeAge})</div>
                                        <div className="text-3xl md:text-4xl font-bold mb-2 tracking-tight">
                                            {formatCompact(Math.ceil(calculation.futureCost))}
                                        </div>
                                        <div className="text-xs text-orange-100 opacity-80">
                                            {formatCompact(currentCost)} today grows to this amount.
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white/10 rounded-xl p-4 border border-white/20 backdrop-blur-sm">
                                        <div className="text-orange-50 text-xs mb-1 uppercase font-semibold">Required Monthly SIP</div>
                                        <div className="text-2xl md:text-3xl font-bold text-white mb-1">
                                            {formatCompact(Math.ceil(calculation.requiredSIP))}
                                        </div>
                                        <div className="text-[10px] text-orange-100">
                                            Start investing now
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Chart Container */}
                            <div className="glass-card rounded-3xl p-6 shadow-xl flex-1 flex flex-col">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="font-bold text-teal-800">Growth to College</h3>
                                    <div className="flex gap-4 text-xs font-semibold">
                                        <div className="flex items-center gap-1">
                                            <div className="w-3 h-3 bg-teal-600 rounded-sm"></div> Invested
                                        </div>
                                        <div className="flex items-center gap-1">
                                            <div className="w-3 h-3 bg-orange-400 rounded-sm"></div> Growth
                                        </div>
                                    </div>
                                </div>

                                <BarChart />

                                <div className="mt-4 border-t border-slate-100 pt-4 flex gap-4 text-xs md:text-sm text-slate-500 bg-slate-50/50 p-4 rounded-xl">
                                    <IconInfo className="flex-shrink-0 text-teal-600" />
                                    <p>
                                        Notice how the <strong>Orange (Growth)</strong> section gets bigger every year? That's compounding paying your child's fees!
                                    </p>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
