<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Retirement Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #6366f1; /* Indigo border */
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 2px;
        }
        /* Hide spin buttons for number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .wealth-card {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); /* Indigo to Violet */
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        
        // Icon Components
        const IconUmbrella = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 12v8a2 2 0 0 0 4 0"/><path d="M12 2v1"/><path d="M12 12a5.994 5.994 0 0 1 5-2 6 6 0 0 1 6 6v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1a6 6 0 0 1 6-6 5.994 5.994 0 0 1 5 2z"/></svg>;
        const IconTrending = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>;
        const IconInfo = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
        const IconPiggy = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 5c-1.5 0-2.8.6-3.8 1.5l-2.5 2.5c-.3.3-.7.5-1.1.6l-1.9.6c-.6.2-1.2.6-1.6 1.1l-.3.4c-.2.2-.4.4-.6.6l-2.9 2.9c-.3.3-.5.7-.6 1.1l-.6 2.6c-.2.8.5 1.6 1.3 1.6l2.3-.6c.4-.1.8-.3 1.1-.6l2.9-2.9c.2-.2.4-.4.6-.6l.4-.3c.5-.4.9-1 1.1-1.6l.6-1.9c.1-.4.3-.8.6-1.1l2.5-2.5C16.2 5.6 17.5 5 19 5Z"/><path d="M13 13h.01"/><path d="M16 16h.01"/><path d="M9 20a1.8 1.8 0 0 0 2.6-2.5"/></svg>;
        const IconUser = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;

        const App = () => {
            // State
            const [currentAge, setCurrentAge] = useState(30);
            const [retireAge, setRetireAge] = useState(60);
            const [lifeExpectancy, setLifeExpectancy] = useState(85);
            const [monthlyExpenses, setMonthlyExpenses] = useState(50000);
            const [inflation, setInflation] = useState(6);
            const [currentSavings, setCurrentSavings] = useState(0);
            const [preRoi, setPreRoi] = useState(12); // Pre-retirement Return
            const [postRoi, setPostRoi] = useState(8); // Post-retirement Return
            const [hoveredYear, setHoveredYear] = useState(null);

            // Indian Currency Formatting
            const formatCurrency = (val) => {
                return new Intl.NumberFormat('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    maximumFractionDigits: 0,
                }).format(val);
            };

            const formatCompact = (val) => {
                return new Intl.NumberFormat('en-IN', {
                    notation: "compact",
                    compactDisplay: "short",
                    style: 'currency',
                    currency: 'INR',
                }).format(val);
            };

            // Logic: Realistic Retirement Calculation
            const calculation = useMemo(() => {
                // 1. Time Horizons
                const yearsToInvest = Math.max(1, retireAge - currentAge);
                const yearsInRetirement = Math.max(1, lifeExpectancy - retireAge);
                const totalMonthsToInvest = yearsToInvest * 12;
                
                // 2. Future Expense Calculation (At time of retirement)
                // FV = PV * (1 + r)^n
                const monthlyInflationRate = inflation / 12 / 100; // Simplified monthly view
                // Actually easier to do annual for inflation projection then divide by 12? 
                // Let's stick to annual compounding for inflation to be standard.
                const futureMonthlyExpense = monthlyExpenses * Math.pow(1 + inflation / 100, yearsToInvest);
                const futureAnnualExpense = futureMonthlyExpense * 12;

                // 3. Corpus Calculation (Present Value of Annuity for Retirement Years)
                // We need a corpus that provides 'futureAnnualExpense' growing at 'inflation' 
                // while the corpus itself grows at 'postRoi'.
                // Real Rate of Return (r) = (1 + Nominal) / (1 + Inflation) - 1
                const realRate = (1 + postRoi / 100) / (1 + inflation / 100) - 1;
                
                let requiredCorpus = 0;
                if (Math.abs(realRate) < 0.0001) {
                    // If real rate is 0, simply Expense * Years
                    requiredCorpus = futureAnnualExpense * yearsInRetirement;
                } else {
                    // PV = PMT * [1 - (1+r)^(-n)] / r
                    // This formula assumes expenses are withdrawn at END of year.
                    requiredCorpus = futureAnnualExpense * (1 - Math.pow(1 + realRate, -yearsInRetirement)) / realRate;
                }

                // 4. Shortfall Calculation
                const preMonthlyRate = preRoi / 12 / 100;
                // Future Value of Current Savings
                const savingsFutureValue = currentSavings * Math.pow(1 + preMonthlyRate, totalMonthsToInvest);
                
                let shortfall = requiredCorpus - savingsFutureValue;
                if (shortfall < 0) shortfall = 0;

                // 5. SIP Calculation to bridge shortfall
                // PMT = FV * r / ((1+r)^n - 1)
                const requiredSIP = shortfall > 0 
                    ? (shortfall * preMonthlyRate) / (Math.pow(1 + preMonthlyRate, totalMonthsToInvest) - 1)
                    : 0;

                // 6. Generate Chart Data (Accumulation Phase)
                const points = [];
                let currentTotalValue = currentSavings;
                let totalInvested = currentSavings;

                for (let m = 1; m <= totalMonthsToInvest; m++) {
                    // Compound existing
                    currentTotalValue = currentTotalValue * (1 + preMonthlyRate);
                    // Add SIP
                    if (requiredSIP > 0) {
                        currentTotalValue += requiredSIP; // Add at end of month
                        // SIP also earns interest? Standard formula assumes PMT at end.
                        // Let's stick to standard accumulation loop.
                        // Current += SIP; Current *= (1+r) ?? No.
                        // Standard: Balance = Balance*(1+r) + SIP.
                    }
                    totalInvested += requiredSIP;

                    if (m % 12 === 0 || m === totalMonthsToInvest) {
                        points.push({
                            age: currentAge + (m / 12),
                            value: currentTotalValue,
                            invested: totalInvested,
                            requiredPath: requiredCorpus // Target line
                        });
                    }
                }

                return {
                    requiredCorpus,
                    futureMonthlyExpense,
                    requiredSIP,
                    savingsFutureValue,
                    points,
                    yearsToInvest
                };
            }, [currentAge, retireAge, lifeExpectancy, monthlyExpenses, inflation, currentSavings, preRoi, postRoi]);

            const finalData = calculation.points[calculation.points.length - 1] || { value: 0 };

            // --- SUB-COMPONENTS ---

            const Chart = () => {
                const data = calculation.points;
                if (data.length === 0) return null;
                
                const height = 220;
                const width = 100;
                
                // Y-axis Scale (Buffer for visibility)
                const maxVal = Math.max(calculation.requiredCorpus, finalData.value) * 1.15; 
                
                const getY = (val) => height - (val / maxVal) * height;
                const getX = (index) => (index / (data.length - 1)) * 100;

                // Path Construction
                let valuePath = `M0,${getY(currentSavings)} `; 
                data.forEach((d, i) => { valuePath += `L${getX(i)},${getY(d.value)} `; });
                valuePath += `L100,${height} L0,${height} Z`; 

                let strokePath = `M0,${getY(currentSavings)} `;
                data.forEach((d, i) => { strokePath += `L${getX(i)},${getY(d.value)} `; });

                const targetY = getY(calculation.requiredCorpus);

                return (
                    <div className="relative h-[250px] w-full mt-6 mb-2 select-none group touch-none">
                        {/* Y-Axis Labels */}
                        <div className="absolute left-0 top-0 bottom-0 w-16 text-[10px] text-slate-400 font-mono border-r border-slate-100/10 z-10">
                            <span className="absolute top-0 right-2 transform -translate-y-1/2">{formatCompact(maxVal)}</span>
                            <span className="absolute top-1/2 right-2 transform -translate-y-1/2">{formatCompact(maxVal/2)}</span>
                            <span className="absolute bottom-0 right-2 transform translate-y-1/2">0</span>
                        </div>

                        {/* Graph Area */}
                        <div className="absolute inset-0 ml-16">
                            <svg className="w-full h-full overflow-visible" preserveAspectRatio="none" viewBox={`0 0 ${width} ${height}`}>
                                <defs>
                                    <linearGradient id="goalGradient" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor="#818cf8" stopOpacity="0.8" />
                                        <stop offset="100%" stopColor="#818cf8" stopOpacity="0.1" />
                                    </linearGradient>
                                </defs>

                                {/* Grid Lines */}
                                <line x1="0" y1="0" x2="100" y2="0" stroke="#94a3b8" strokeWidth="0.5" strokeDasharray="2 2" opacity="0.2" vectorEffect="non-scaling-stroke"/>
                                <line x1="0" y1={height/2} x2="100" y2={height/2} stroke="#94a3b8" strokeWidth="0.5" strokeDasharray="2 2" opacity="0.2" vectorEffect="non-scaling-stroke"/>
                                <line x1="0" y1={height} x2="100" y2={height} stroke="#94a3b8" strokeWidth="0.5" opacity="0.2" vectorEffect="non-scaling-stroke"/>

                                {/* Target Line */}
                                <g className="transition-all duration-500 ease-out">
                                    <line x1="0" y1={targetY} x2="100" y2={targetY} stroke="#c026d3" strokeWidth="1.5" strokeDasharray="4 4" vectorEffect="non-scaling-stroke" />
                                    <text x="100" y={targetY - 5} textAnchor="end" fill="#c026d3" fontSize="8" fontWeight="bold" className="uppercase tracking-wider shadow-sm">Target Corpus</text>
                                </g>

                                {/* Growth Area */}
                                <path d={valuePath} fill="url(#goalGradient)" className="transition-all duration-300 ease-out"/>
                                <path d={strokePath} fill="none" stroke="#4f46e5" strokeWidth="3" vectorEffect="non-scaling-stroke" />
                            </svg>

                            {/* Hover Overlay */}
                            <div className="absolute inset-0 flex">
                                {data.map((d, i) => (
                                    <div 
                                        key={i} 
                                        className="flex-1 hover:bg-white/5 z-10 cursor-pointer relative group/bar"
                                        onMouseEnter={() => setHoveredYear(d.age)}
                                        onMouseLeave={() => setHoveredYear(null)}
                                        onTouchStart={() => setHoveredYear(d.age)}
                                    >
                                        <div className="hidden group-hover/bar:block absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-slate-800 text-white text-xs p-3 rounded-lg shadow-xl whitespace-nowrap z-20 pointer-events-none border border-slate-700">
                                            <div className="font-bold text-indigo-400 border-b border-slate-600 pb-1 mb-1">Age {Math.floor(d.age)}</div>
                                            <div className="text-white mb-1">Corpus: {formatCompact(d.value)}</div>
                                            <div className="text-slate-400 text-[10px]">
                                                {((d.value/calculation.requiredCorpus)*100).toFixed(0)}% of Target
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-4 md:p-8 flex items-center justify-center">
                    
                    <div className="w-full max-w-6xl grid md:grid-cols-12 gap-6">
                        
                        {/* LEFT COLUMN: Controls */}
                        <div className="md:col-span-5 space-y-4">
                            
                            {/* Title Card */}
                            <div className="bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-3xl text-white">
                                <h1 className="text-3xl font-bold flex items-center gap-3 mb-2">
                                    <span className="bg-indigo-500 p-2 rounded-xl text-white">
                                        <IconUmbrella />
                                    </span>
                                    Retirement Plan
                                </h1>
                                <p className="text-indigo-200 text-sm">Calculate the true cost of your financial freedom.</p>
                            </div>

                            {/* Controls Card */}
                            <div className="glass-card rounded-3xl p-6 md:p-8 shadow-xl space-y-6 max-h-[70vh] overflow-y-auto">
                                
                                {/* 1. Timeline Section */}
                                <div className="space-y-4 border-b border-slate-100 pb-6">
                                    <div className="flex items-center gap-2 text-indigo-600 font-bold uppercase text-xs tracking-wider">
                                        <IconUser size={14}/> Timeline
                                    </div>
                                    
                                    {/* Age Inputs Row */}
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-slate-500 text-xs font-semibold">Current Age</label>
                                            <div className="flex items-center gap-2">
                                                <input type="number" value={currentAge} onChange={(e) => setCurrentAge(Number(e.target.value))} className="w-full font-bold text-slate-700 bg-slate-50 p-2 rounded border border-slate-200" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-slate-500 text-xs font-semibold">Retirement Age</label>
                                            <div className="flex items-center gap-2">
                                                <input type="number" value={retireAge} onChange={(e) => setRetireAge(Number(e.target.value))} className="w-full font-bold text-slate-700 bg-slate-50 p-2 rounded border border-slate-200" />
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* Life Expectancy */}
                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <label className="text-slate-500 font-semibold">Life Expectancy</label>
                                            <span className="text-slate-700 font-bold">{lifeExpectancy} Years</span>
                                        </div>
                                        <input type="range" min="60" max="100" value={lifeExpectancy} onChange={(e) => setLifeExpectancy(Number(e.target.value))} />
                                    </div>
                                </div>

                                {/* 2. Expenses Section */}
                                <div className="space-y-4 border-b border-slate-100 pb-6">
                                    <div className="flex items-center gap-2 text-indigo-600 font-bold uppercase text-xs tracking-wider">
                                        <IconTrending size={14}/> Lifestyle
                                    </div>

                                    {/* Monthly Expense */}
                                    <div>
                                        <div className="flex justify-between items-end mb-2">
                                            <label className="text-slate-500 font-semibold text-xs">Current Monthly Expense</label>
                                            <div className="flex items-center bg-slate-100 rounded px-2 py-1">
                                                <span className="text-sm font-bold text-slate-500 mr-1">₹</span>
                                                <input type="number" value={monthlyExpenses} onChange={(e) => setMonthlyExpenses(Number(e.target.value))} className="text-lg font-bold text-slate-800 bg-transparent w-24 text-right focus:outline-none" />
                                            </div>
                                        </div>
                                        <input type="range" min="10000" max="500000" step="5000" value={monthlyExpenses} onChange={(e) => setMonthlyExpenses(Number(e.target.value))} />
                                    </div>

                                    {/* Inflation */}
                                    <div>
                                        <div className="flex justify-between text-xs mb-1">
                                            <label className="text-slate-500 font-semibold">Expected Inflation</label>
                                            <span className="text-slate-700 font-bold">{inflation}%</span>
                                        </div>
                                        <input type="range" min="2" max="12" step="0.5" value={inflation} onChange={(e) => setInflation(Number(e.target.value))} />
                                        <p className="text-[10px] text-slate-400 mt-1">Impact: Reduces future purchasing power.</p>
                                    </div>
                                </div>

                                {/* 3. Investments Section */}
                                <div className="space-y-4">
                                    <div className="flex items-center gap-2 text-indigo-600 font-bold uppercase text-xs tracking-wider">
                                        <IconPiggy size={14}/> Finances
                                    </div>

                                    {/* Current Savings */}
                                    <div>
                                        <div className="flex justify-between items-end mb-2">
                                            <label className="text-slate-500 font-semibold text-xs">Existing Savings</label>
                                            <div className="flex items-center bg-slate-100 rounded px-2 py-1">
                                                <span className="text-sm font-bold text-slate-500 mr-1">₹</span>
                                                <input type="number" value={currentSavings} onChange={(e) => setCurrentSavings(Number(e.target.value))} className="text-lg font-bold text-slate-800 bg-transparent w-28 text-right focus:outline-none" />
                                            </div>
                                        </div>
                                        <input type="range" min="0" max="10000000" step="100000" value={currentSavings} onChange={(e) => setCurrentSavings(Number(e.target.value))} />
                                    </div>

                                    {/* ROIs Grid */}
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-slate-500 text-[10px] font-semibold block mb-1">Pre-Retire Return</label>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="text-lg font-bold text-indigo-600">{preRoi}%</span>
                                            </div>
                                            <input type="range" min="6" max="20" step="0.5" value={preRoi} onChange={(e) => setPreRoi(Number(e.target.value))} className="h-2" />
                                        </div>
                                        <div>
                                            <label className="text-slate-500 text-[10px] font-semibold block mb-1">Post-Retire Return</label>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="text-lg font-bold text-emerald-600">{postRoi}%</span>
                                            </div>
                                            <input type="range" min="4" max="15" step="0.5" value={postRoi} onChange={(e) => setPostRoi(Number(e.target.value))} className="h-2" />
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                        {/* RIGHT COLUMN: Results & Chart */}
                        <div className="md:col-span-7 flex flex-col gap-6">
                            
                            {/* Required Corpus Card */}
                            <div className="wealth-card rounded-3xl p-6 md:p-8 text-white relative overflow-hidden transition-all duration-300">
                                <div className="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
                                <div className="absolute bottom-0 left-0 w-32 h-32 bg-black/10 rounded-full blur-2xl"></div>
                                
                                <div className="relative z-10 grid md:grid-cols-2 gap-8 items-center">
                                    <div>
                                        <div className="text-indigo-200 font-medium mb-1 uppercase tracking-wider text-xs">Required Corpus</div>
                                        <div className="text-3xl md:text-4xl font-bold mb-2 tracking-tight">
                                            {formatCompact(Math.ceil(calculation.requiredCorpus))}
                                        </div>
                                        <div className="text-xs text-indigo-200">
                                            To sustain you from age {retireAge} to {lifeExpectancy}
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white/10 rounded-xl p-4 border border-white/10">
                                        <div className="text-indigo-100 text-xs mb-1 uppercase font-semibold">Start Monthly SIP</div>
                                        <div className="text-2xl md:text-3xl font-bold text-white mb-1">
                                            {formatCompact(Math.ceil(calculation.requiredSIP))}
                                        </div>
                                        <div className="text-[10px] text-indigo-200">
                                            For next {calculation.yearsToInvest} years
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-4 border-t border-white/10 pt-4 mt-6">
                                    <div>
                                        <div className="text-indigo-200 text-xs mb-1">Expenses at Retirement</div>
                                        <div className="text-lg font-semibold">{formatCompact(calculation.futureMonthlyExpense)}<span className="text-xs font-normal">/mo</span></div>
                                    </div>
                                    <div>
                                        <div className="text-indigo-200 text-xs mb-1">Savings Growth</div>
                                        <div className="text-lg font-semibold">{formatCompact(calculation.savingsFutureValue)}</div>
                                    </div>
                                </div>
                            </div>

                            {/* Chart Container */}
                            <div className="glass-card rounded-3xl p-6 shadow-xl flex-1 flex flex-col">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="font-bold text-slate-700">Accumulation Path</h3>
                                    <div className="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded font-bold border border-indigo-100">
                                        Goal: {formatCompact(calculation.requiredCorpus)}
                                    </div>
                                </div>

                                <Chart />

                                <div className="mt-6 pt-6 border-t border-slate-100 flex gap-4 text-xs md:text-sm text-slate-500 bg-slate-50/50 p-4 rounded-xl">
                                    <IconInfo className="flex-shrink-0" />
                                    <p>
                                        Due to <strong>{inflation}% inflation</strong>, your monthly expense of <strong>{formatCompact(monthlyExpenses)}</strong> will grow to <strong>{formatCompact(calculation.futureMonthlyExpense)}</strong> by the time you retire at age {retireAge}.
                                    </p>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
