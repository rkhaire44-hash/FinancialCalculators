<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Home Loan Calculator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #38bdf8; /* Sky border */
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #bae6fd;
            border-radius: 2px;
        }
        /* Hide spin buttons for number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .wealth-card {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.5);
        }
        /* Scrollbar for table */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        
        // Icon Components
        const IconHome = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const IconPercent = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>;
        const IconClock = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const IconZap = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
        const IconPie = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>;
        const IconTrending = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>;
        const IconTable = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="3" x2="21" y1="15" y2="15"/><line x1="12" x2="12" y1="3" y2="21"/></svg>;


        const App = () => {
            // State
            const [loanAmount, setLoanAmount] = useState(5000000); // 50 Lakhs
            const [interestRate, setInterestRate] = useState(8.5);
            const [tenureYears, setTenureYears] = useState(20);
            const [annualPrepayment, setAnnualPrepayment] = useState(0); // Renamed to annual
            const [viewMode, setViewMode] = useState('chart'); // 'chart', 'pie', 'schedule'
            const [hoveredData, setHoveredData] = useState(null);

            // Indian Currency Formatting
            const formatCurrency = (val) => {
                return new Intl.NumberFormat('en-IN', {
                    style: 'currency',
                    currency: 'INR',
                    maximumFractionDigits: 0,
                }).format(val);
            };

            const formatCompact = (val) => {
                return new Intl.NumberFormat('en-IN', {
                    notation: "compact",
                    compactDisplay: "short",
                    style: 'currency',
                    currency: 'INR',
                }).format(val);
            };

            // Logic: Loan Amortization
            const calculation = useMemo(() => {
                const r = interestRate / 12 / 100;
                const n = tenureYears * 12;

                // 1. Calculate Standard EMI
                // EMI = [P x R x (1+R)^N] / [(1+R)^N-1]
                const emi = (loanAmount * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                
                // 2. Generate Amortization Schedule (Normal vs Prepaid)
                const points = [];
                const schedule = []; // For yearly table

                let balanceNormal = loanAmount;
                let balancePrepaid = loanAmount;
                
                let totalInterestNormal = 0;
                let totalInterestPrepaid = 0;
                
                let monthsPrepaid = n; 
                let finishedPrepaid = false;

                // Trackers for Yearly aggregation (Prepaid Scenario)
                let yearlyInterest = 0;
                let yearlyPrincipal = 0;
                let yearlyPayment = 0;

                // Loop through max tenure
                for (let m = 1; m <= n; m++) {
                    
                    // --- Normal Path (Reference for savings calc) ---
                    let interestN = balanceNormal * r;
                    let principalN = emi - interestN;
                    if (balanceNormal > 0) {
                        totalInterestNormal += interestN;
                        balanceNormal -= principalN;
                        if(balanceNormal < 0) balanceNormal = 0;
                    }

                    // --- Prepaid Path (Actual Logic) ---
                    if (!finishedPrepaid) {
                        let interestP = balancePrepaid * r;
                        
                        // Check for Annual Prepayment (Every 12th month)
                        let extraPay = (m % 12 === 0) ? annualPrepayment : 0;
                        let paymentP = emi + extraPay;
                        
                        let principalP = paymentP - interestP;
                        
                        // Check if final payment
                        if (balancePrepaid < principalP) {
                            // Last month adjustment
                            interestP = balancePrepaid * r;
                            principalP = balancePrepaid; // Pay off remainder
                            paymentP = principalP + interestP;
                            
                            totalInterestPrepaid += interestP;
                            balancePrepaid = 0;
                            monthsPrepaid = m;
                            finishedPrepaid = true;
                        } else {
                            totalInterestPrepaid += interestP;
                            balancePrepaid -= principalP;
                        }

                        // Accumulate Yearly Data
                        yearlyInterest += interestP;
                        yearlyPrincipal += principalP;
                        yearlyPayment += paymentP;
                    }

                    // Snapshot at End of Year (for Chart & Table)
                    if (m % 12 === 0 || m === n || (finishedPrepaid && m === monthsPrepaid)) {
                        
                        // Push to chart points
                        points.push({
                            year: m / 12,
                            balanceNormal: Math.max(0, balanceNormal),
                            balancePrepaid: Math.max(0, balancePrepaid)
                        });

                        // Push to Schedule Table (If this year had activity)
                        if (yearlyPayment > 0) {
                            schedule.push({
                                year: Math.ceil(m / 12),
                                interest: yearlyInterest,
                                principal: yearlyPrincipal,
                                totalPayment: yearlyPayment,
                                balance: Math.max(0, balancePrepaid)
                            });
                        }

                        // Reset aggregators for next year
                        yearlyInterest = 0;
                        yearlyPrincipal = 0;
                        yearlyPayment = 0;
                    }
                }

                return {
                    emi,
                    totalInterestNormal,
                    totalInterestPrepaid,
                    monthsPrepaid,
                    savedInterest: totalInterestNormal - totalInterestPrepaid,
                    savedMonths: n - monthsPrepaid,
                    points,
                    schedule
                };
            }, [loanAmount, interestRate, tenureYears, annualPrepayment]);

            const finalData = calculation.points[calculation.points.length - 1];

            // --- SUB-COMPONENTS ---

            const LineChart = () => {
                const data = calculation.points;
                if (data.length === 0) return null;

                const height = 220;
                const maxVal = loanAmount * 1.05; // Buffer

                const getY = (val) => height - (val / maxVal) * height;
                const getX = (index) => (index / (data.length - 1)) * 100;

                // Normal Path (White Line)
                let normalPath = `M0,${getY(loanAmount)} `;
                data.forEach((d, i) => { normalPath += `L${getX(i)},${getY(d.balanceNormal)} `; });

                // Prepaid Path (Green Area)
                let prepaidPath = `M0,${getY(loanAmount)} `;
                data.forEach((d, i) => { prepaidPath += `L${getX(i)},${getY(d.balancePrepaid)} `; });
                const prepaidArea = prepaidPath + `L${getX(data.length-1)},${height} L0,${height} Z`;

                return (
                    <div className="relative h-[250px] w-full mt-4 select-none animate-in fade-in duration-500">
                         {/* Y-Axis Labels */}
                         <div className="absolute left-0 top-0 bottom-0 flex flex-col justify-between text-[10px] text-slate-400 font-mono">
                            <span>{formatCompact(loanAmount)}</span>
                            <span>{formatCompact(loanAmount/2)}</span>
                            <span>0</span>
                        </div>

                        <div className="absolute inset-0 ml-8">
                            <svg className="w-full h-full overflow-visible" preserveAspectRatio="none" viewBox="0 0 100 220">
                                <defs>
                                    <linearGradient id="prepaidGrad" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0%" stopColor="#0ea5e9" stopOpacity="0.5" />
                                        <stop offset="100%" stopColor="#0ea5e9" stopOpacity="0.1" />
                                    </linearGradient>
                                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="0.5"/>
                                    </pattern>
                                </defs>

                                {/* Grid Background */}
                                <rect width="100" height="220" fill="url(#grid)" />

                                {/* Normal Balance (Dashed Line) */}
                                <path d={normalPath} fill="none" stroke="#94a3b8" strokeWidth="2" strokeDasharray="4 4" vectorEffect="non-scaling-stroke" opacity="0.6"/>

                                {/* Prepaid Balance (Solid Area) */}
                                <path d={prepaidArea} fill="url(#prepaidGrad)" />
                                <path d={prepaidPath} fill="none" stroke="#0ea5e9" strokeWidth="3" vectorEffect="non-scaling-stroke" />

                                {/* Interactive Overlay */}
                                {data.map((d, i) => (
                                    <rect 
                                        key={i}
                                        x={getX(i) - 0.5} y="0" width="1" height="220" 
                                        fill="transparent" 
                                        stroke="transparent" 
                                        strokeWidth="5" // Hit area
                                        className="cursor-pointer hover:stroke-white/10"
                                        vectorEffect="non-scaling-stroke"
                                        onMouseEnter={() => setHoveredData(d)}
                                        onMouseLeave={() => setHoveredData(null)}
                                        onTouchStart={() => setHoveredData(d)}
                                    />
                                ))}

                                {/* Savings Highlight Annotation */}
                                {annualPrepayment > 0 && calculation.savedMonths > 0 && (
                                    <g>
                                        <text x="50" y="30" textAnchor="middle" fill="#0ea5e9" fontSize="8" fontWeight="bold">
                                            Finishes {Math.floor(calculation.savedMonths/12)} Years Early
                                        </text>
                                    </g>
                                )}
                            </svg>
                            
                            {/* Floating Tooltip */}
                            {hoveredData && (
                                <div className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-full bg-slate-800 text-white text-xs p-2 rounded shadow-lg pointer-events-none mb-2 w-max z-20">
                                    <div className="font-bold border-b border-slate-600 mb-1 pb-1">Year {hoveredData.year.toFixed(1)}</div>
                                    <div className="flex justify-between gap-3 text-slate-400">
                                        <span>Original Balance:</span>
                                        <span>{formatCompact(hoveredData.balanceNormal)}</span>
                                    </div>
                                    <div className="flex justify-between gap-3 text-sky-400">
                                        <span>New Balance:</span>
                                        <span>{formatCompact(hoveredData.balancePrepaid)}</span>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const PieChart = () => {
                const totalInterest = calculation.totalInterestPrepaid;
                const totalAmount = loanAmount + totalInterest;
                
                const principalPct = (loanAmount / totalAmount) * 100;
                const interestPct = (totalInterest / totalAmount) * 100;
                
                return (
                     <div className="h-[250px] w-full mt-4 flex items-center justify-center gap-8 animate-in fade-in duration-500">
                        <div className="relative w-40 h-40">
                            <svg viewBox="0 0 42 42" className="w-full h-full transform -rotate-90">
                                {/* Background Ring */}
                                <circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="#e2e8f0" strokeWidth="4" />
                                
                                {/* Principal Segment (Sky Blue) */}
                                <circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="#0ea5e9" strokeWidth="6" 
                                    strokeDasharray={`${principalPct} ${100 - principalPct}`} 
                                    strokeDashoffset="0"
                                    className="transition-all duration-1000 ease-out"
                                />
                                
                                {/* Interest Segment (Slate/Darker) */}
                                <circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="#64748b" strokeWidth="6" 
                                    strokeDasharray={`${interestPct} ${100 - interestPct}`} 
                                    strokeDashoffset={`-${principalPct}`}
                                    className="transition-all duration-1000 ease-out"
                                />
                            </svg>
                            <div className="absolute inset-0 flex flex-col items-center justify-center text-xs text-slate-500 font-bold">
                                <span>Total Payable</span>
                                <span className="text-slate-800 text-sm">{formatCompact(totalAmount)}</span>
                            </div>
                        </div>

                        <div className="space-y-4 text-sm min-w-[120px]">
                            <div>
                                <div className="flex items-center gap-2 text-sky-600 mb-1">
                                    <div className="w-3 h-3 bg-sky-500 rounded-full"></div>
                                    Principal
                                </div>
                                <div className="font-bold text-slate-700 text-lg">{principalPct.toFixed(1)}%</div>
                                <div className="text-xs text-slate-400">{formatCompact(loanAmount)}</div>
                            </div>
                            <div>
                                <div className="flex items-center gap-2 text-slate-500 mb-1">
                                    <div className="w-3 h-3 bg-slate-500 rounded-full"></div>
                                    Interest
                                </div>
                                <div className="font-bold text-slate-700 text-lg">{interestPct.toFixed(1)}%</div>
                                <div className="text-xs text-slate-400">{formatCompact(totalInterest)}</div>
                            </div>
                        </div>
                     </div>
                )
            }

            const ScheduleTable = () => {
                return (
                    <div className="h-[250px] w-full mt-4 animate-in fade-in duration-500 flex flex-col">
                        <div className="text-xs text-slate-500 mb-2 font-medium">
                            Based on your current prepayment plan:
                        </div>
                        <div className="flex-1 overflow-auto custom-scrollbar border border-slate-100 rounded-lg">
                            <table className="w-full text-xs text-left">
                                <thead className="bg-slate-50 sticky top-0 z-10 text-slate-500 font-semibold">
                                    <tr>
                                        <th className="p-2 border-b">Year</th>
                                        <th className="p-2 border-b text-right">Paid</th>
                                        <th className="p-2 border-b text-right">Interest</th>
                                        <th className="p-2 border-b text-right">Principal</th>
                                        <th className="p-2 border-b text-right">Balance</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-slate-700">
                                    {calculation.schedule.map((row) => (
                                        <tr key={row.year} className="hover:bg-sky-50 transition-colors">
                                            <td className="p-2 font-medium text-slate-500">{row.year}</td>
                                            <td className="p-2 text-right">{formatCompact(row.totalPayment)}</td>
                                            <td className="p-2 text-right text-red-400">{formatCompact(row.interest)}</td>
                                            <td className="p-2 text-right text-green-500">{formatCompact(row.principal)}</td>
                                            <td className="p-2 text-right font-bold text-slate-800">{formatCompact(row.balance)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen p-4 md:p-8 flex items-center justify-center">
                    
                    <div className="w-full max-w-6xl grid md:grid-cols-12 gap-6">
                        
                        {/* LEFT COLUMN: Controls */}
                        <div className="md:col-span-5 space-y-4">
                            
                            {/* Title Card */}
                            <div className="bg-white/10 backdrop-blur-md border border-white/20 p-6 rounded-3xl text-white">
                                <h1 className="text-3xl font-bold flex items-center gap-3 mb-2">
                                    <span className="bg-sky-500 p-2 rounded-xl text-white border border-sky-300/30">
                                        <IconHome />
                                    </span>
                                    Loan Planner
                                </h1>
                                <p className="text-sky-100 text-sm">Visualize your home loan & prepayment impact.</p>
                            </div>

                            {/* Controls Card */}
                            <div className="glass-card rounded-3xl p-6 md:p-8 shadow-xl space-y-6 max-h-[70vh] overflow-y-auto">
                                
                                {/* 1. Loan Amount */}
                                <div>
                                    <div className="flex justify-between items-end mb-2">
                                        <label className="text-slate-500 font-semibold text-xs uppercase tracking-wider flex items-center gap-1">
                                            <IconHome size={14} /> Loan Amount
                                        </label>
                                        <div className="flex items-center bg-slate-100 rounded px-2 py-1 border border-slate-200 focus-within:border-sky-500 transition-colors">
                                            <span className="text-sm font-bold text-slate-500 mr-1">₹</span>
                                            <input type="number" value={loanAmount} onChange={(e) => setLoanAmount(Number(e.target.value))} className="text-lg font-bold text-slate-800 bg-transparent w-32 text-right focus:outline-none" />
                                        </div>
                                    </div>
                                    <input type="range" min="1000000" max="20000000" step="500000" value={loanAmount} onChange={(e) => setLoanAmount(Number(e.target.value))} />
                                    <div className="flex justify-between text-xs text-slate-400 mt-1">
                                        <span>₹10 L</span>
                                        <span>₹2 Cr</span>
                                    </div>
                                </div>

                                {/* 2. Interest Rate */}
                                <div>
                                    <div className="flex justify-between items-end mb-2">
                                        <label className="text-slate-500 font-semibold text-xs uppercase tracking-wider flex items-center gap-1">
                                            <IconPercent size={14} /> Interest Rate
                                        </label>
                                        <div className="flex items-center bg-slate-100 rounded px-2 py-1 border border-slate-200 focus-within:border-sky-500 transition-colors">
                                            <input type="number" value={interestRate} onChange={(e) => setInterestRate(Number(e.target.value))} className="text-lg font-bold text-slate-800 bg-transparent w-16 text-right focus:outline-none" />
                                            <span className="text-sm font-bold text-slate-500 ml-1">%</span>
                                        </div>
                                    </div>
                                    <input type="range" min="6" max="15" step="0.1" value={interestRate} onChange={(e) => setInterestRate(Number(e.target.value))} />
                                    <div className="flex justify-between text-xs text-slate-400 mt-1">
                                        <span>6%</span>
                                        <span>15%</span>
                                    </div>
                                </div>

                                {/* 3. Tenure */}
                                <div>
                                    <div className="flex justify-between items-end mb-2">
                                        <label className="text-slate-500 font-semibold text-xs uppercase tracking-wider flex items-center gap-1">
                                            <IconClock size={14} /> Tenure
                                        </label>
                                        <div className="flex items-center bg-slate-100 rounded px-2 py-1 border border-slate-200 focus-within:border-sky-500 transition-colors">
                                            <input type="number" value={tenureYears} onChange={(e) => setTenureYears(Number(e.target.value))} className="text-lg font-bold text-slate-800 bg-transparent w-16 text-right focus:outline-none" />
                                            <span className="text-sm font-bold text-slate-500 ml-1">Yrs</span>
                                        </div>
                                    </div>
                                    <input type="range" min="5" max="30" step="1" value={tenureYears} onChange={(e) => setTenureYears(Number(e.target.value))} />
                                    <div className="flex justify-between text-xs text-slate-400 mt-1">
                                        <span>5 Yrs</span>
                                        <span>30 Yrs</span>
                                    </div>
                                </div>

                                {/* 4. Prepayment (Changed to Annual) */}
                                <div className="bg-sky-50 p-4 rounded-xl border border-sky-100">
                                    <div className="flex justify-between items-end mb-2">
                                        <label className="text-sky-700 font-bold text-xs uppercase tracking-wider flex items-center gap-1">
                                            <IconZap size={14} className="fill-sky-500"/> Extra Annual Pay
                                        </label>
                                        <div className="flex items-center bg-white rounded px-2 py-1 border border-sky-200 focus-within:border-sky-500 transition-colors shadow-sm">
                                            <span className="text-sm font-bold text-sky-500 mr-1">+₹</span>
                                            <input type="number" value={annualPrepayment} onChange={(e) => setAnnualPrepayment(Number(e.target.value))} className="text-lg font-bold text-sky-700 bg-transparent w-24 text-right focus:outline-none" />
                                        </div>
                                    </div>
                                    <input type="range" min="0" max="500000" step="10000" value={annualPrepayment} onChange={(e) => setAnnualPrepayment(Number(e.target.value))} className="accent-sky-500"/>
                                    <p className="text-[10px] text-sky-600 mt-2">
                                        Pay a lump sum once a year (e.g., bonus) to reduce tenure.
                                    </p>
                                </div>

                            </div>
                        </div>

                        {/* RIGHT COLUMN: Results & Chart */}
                        <div className="md:col-span-7 flex flex-col gap-6">
                            
                            {/* Summary Card */}
                            <div className="wealth-card rounded-3xl p-6 md:p-8 text-white relative overflow-hidden transition-all duration-300">
                                <div className="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
                                <div className="absolute bottom-0 left-0 w-32 h-32 bg-black/10 rounded-full blur-2xl"></div>
                                
                                <div className="relative z-10 grid md:grid-cols-2 gap-8 items-start">
                                    <div>
                                        <div className="text-sky-100 font-medium mb-1 uppercase tracking-wider text-xs">Monthly EMI</div>
                                        <div className="text-4xl md:text-5xl font-bold mb-4 tracking-tight">
                                            {formatCompact(Math.ceil(calculation.emi))}
                                        </div>
                                        
                                        <div className="space-y-1">
                                            <div className="flex justify-between text-xs text-sky-100 border-b border-white/10 pb-1 mb-1">
                                                <span>Total Payable</span>
                                                <span className="font-bold">{formatCompact(loanAmount + calculation.totalInterestPrepaid)}</span>
                                            </div>
                                            <div className="flex justify-between text-xs text-sky-200">
                                                <span>Total Interest</span>
                                                <span>{formatCompact(Math.ceil(calculation.totalInterestPrepaid))}</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-4">
                                        {/* Savings Box */}
                                        {annualPrepayment > 0 ? (
                                            <div className="bg-white/20 backdrop-blur-md rounded-xl p-4 border border-white/20">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <IconZap size={16} className="text-yellow-300 fill-yellow-300"/>
                                                    <span className="text-xs font-bold uppercase text-white">Prepayment Power</span>
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <div className="text-xl font-bold text-white">{formatCompact(Math.ceil(calculation.savedInterest))}</div>
                                                        <div className="text-[10px] text-sky-100">Interest Saved</div>
                                                    </div>
                                                    <div>
                                                        <div className="text-xl font-bold text-white">{(calculation.savedMonths/12).toFixed(1)} <span className="text-sm font-normal">Yrs</span></div>
                                                        <div className="text-[10px] text-sky-100">Saved</div>
                                                    </div>
                                                </div>
                                                <div className="mt-2 text-[10px] text-sky-100 text-center border-t border-white/10 pt-2">
                                                    New Tenure: <strong>{(calculation.monthsPrepaid/12).toFixed(1)} Years</strong>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="bg-white/5 rounded-xl p-4 border border-white/10 text-center">
                                                <p className="text-sm text-sky-100 opacity-80">Add <strong>Extra Annual Pay</strong> to see how much you can save!</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Chart Container */}
                            <div className="glass-card rounded-3xl p-6 shadow-xl flex-1 flex flex-col">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="font-bold text-slate-700">Analysis</h3>
                                    
                                    {/* View Toggle */}
                                    <div className="flex bg-slate-100 p-1 rounded-lg">
                                        <button 
                                            onClick={() => setViewMode('chart')}
                                            className={`flex items-center gap-1 md:gap-2 px-2 md:px-3 py-1 rounded-md text-[10px] md:text-xs font-bold transition-all ${viewMode === 'chart' ? 'bg-white shadow text-sky-600' : 'text-slate-500'}`}
                                        >
                                            <IconTrending size={14} /> Trajectory
                                        </button>
                                        <button 
                                            onClick={() => setViewMode('pie')}
                                            className={`flex items-center gap-1 md:gap-2 px-2 md:px-3 py-1 rounded-md text-[10px] md:text-xs font-bold transition-all ${viewMode === 'pie' ? 'bg-white shadow text-sky-600' : 'text-slate-500'}`}
                                        >
                                            <IconPie size={14} /> Breakdown
                                        </button>
                                         <button 
                                            onClick={() => setViewMode('schedule')}
                                            className={`flex items-center gap-1 md:gap-2 px-2 md:px-3 py-1 rounded-md text-[10px] md:text-xs font-bold transition-all ${viewMode === 'schedule' ? 'bg-white shadow text-sky-600' : 'text-slate-500'}`}
                                        >
                                            <IconTable size={14} /> Schedule
                                        </button>
                                    </div>
                                </div>

                                {viewMode === 'chart' && <LineChart />}
                                {viewMode === 'pie' && <PieChart />}
                                {viewMode === 'schedule' && <ScheduleTable />}

                                <div className="mt-4 border-t border-slate-100 pt-4 flex gap-4 text-xs md:text-sm text-slate-500 bg-slate-50/50 p-4 rounded-xl">
                                    <div className="flex-1">
                                        <span className="block font-bold text-slate-700 mb-1">Did you know?</span>
                                        Increasing your EMI by just 5% every year can reduce a 20-year loan to almost 12 years!
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
